<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <title>{% block title %}Bitvocation CV Doctor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .full-width-image {
            background: url('{{ url_for("static", filename="landing_page.jpg") }}') no-repeat center center;
            background-size: cover;
            height: 100vh;
        }
        .intro-text {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .navbar-brand img {
            max-height: 50px;
        }
        .dropdown-menu {
            min-width: 300px;
            padding: 20px;
        }
        .dropdown-menu form {
            margin: 0;
        }
        .login-form {
            padding-left: 10px;
            position: relative;
            display: inline-block;
        }
        .navbar-form {
            display: flex;
            align-items: center;
            gap: 5px; /* Space between elements */
        }

        .login-error {
            color: red;
            font-size: 14px;
            position: absolute;
            top: 100%;
            right: 10;
            margin-top: 1px; /* Add spacing below the form */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid" style="background-color:#f7931a">
        <a class="navbar-brand" href="#">
            <img src="{{ url_for('static', filename='favicon.ico') }}" alt="Bitvocation Logo"> Bitvocation
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if not session.logged_in %}
                    <!-- Login Form in Navbar -->
                    <li class="nav-item">
                        <form class="navbar-form d-flex login-form" method="POST" action="{{ url_for('login') }}">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <button type="submit" class="btn btn-primary px-5">Login</button>
                        </form>
                        {% if error_message %}
                            <span class="login-error"><p class="text-danger  login-form mt-2">{{ error_message }}</p></span>
                        {% endif %}
                        
                    </li>
                {% else %}
                    <!-- Logout Button -->
                    <li class="nav-item">
                        <form class="navbar-form d-flex login-form" method="POST" action="{{ url_for('logout') }}">
                            <button type="submit" class="btn btn-danger px-5">Logout</button>
                        </form>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}
</body>
</html>
